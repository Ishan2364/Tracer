<svg width="1420" height="930" viewBox="0 0 1420 930" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2140"/>
      <stop offset="100%" stop-color="#141833"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1420" height="930" fill="none"/>

  <text x="30" y="15" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#64748b">OFFLINE — INDEXED ONCE PER EPISODE</text>
  <text x="830" y="15" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#64748b">LIVE — EVERY TURN</text>

  <!-- A1 Podcast Audio -->
  <rect x="30" y="30" width="170" height="90" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.5"/>
  <text x="115" y="70" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Podcast Audio</text>
  <text x="115" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">.mp3 / .wav / .m4a / .flac</text>

  <line x1="200" y1="75" x2="248" y2="70" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- A2 Deepgram -->
  <rect x="250" y="20" width="230" height="100" rx="10" fill="url(#node)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="365" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Deepgram Nova-3</text>
  <text x="365" y="80" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">ASR + diarization</text>
  <text x="365" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">single API call</text>

  <line x1="480" y1="70" x2="528" y2="70" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- A3 Chunk + Embed -->
  <rect x="530" y="30" width="220" height="80" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.5"/>
  <text x="640" y="65" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Chunk + Embed</text>
  <text x="640" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">bge-base-en-v1.5, ~30–90s</text>

  <path d="M640,110 C640,260 135,260 135,438" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="390" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">index build</text>

  <!-- A4 Vector DB -->
  <rect x="30" y="440" width="210" height="90" rx="10" fill="url(#node)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="135" y="478" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Vector DB — Chroma</text>
  <text x="135" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">cosine distance, persistent</text>

  <!-- B1 Query -->
  <rect x="830" y="30" width="170" height="70" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.5"/>
  <text x="915" y="60" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Query</text>
  <text x="915" y="82" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">current turn's question</text>

  <!-- B2 Conversation Memory -->
  <rect x="1030" y="30" width="220" height="70" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.5"/>
  <text x="1140" y="60" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Conversation Memory</text>
  <text x="1140" y="82" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">last 2 turns + prior chunks</text>

  <line x1="920" y1="100" x2="925" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="1120" y1="100" x2="1090" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- C1 Classify Intent -->
  <rect x="830" y="150" width="340" height="90" rx="10" fill="url(#node)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1000" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Classify Intent</text>
  <text x="1000" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">small model — Groq gpt-oss-20b</text>
  <text x="1000" y="225" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">8 intent types, incl. follow_up</text>

  <line x1="900" y1="240" x2="720" y2="288" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="795" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">chitchat / no retrieval</text>

  <line x1="1080" y1="240" x2="1005" y2="273" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1075" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">content question</text>

  <!-- D1 Chitchat Answer -->
  <rect x="580" y="290" width="250" height="80" rx="10" fill="url(#node)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="705" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Chitchat Answer</text>
  <text x="705" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">warm reply, zero retrieval</text>
  <text x="705" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Gate-2 net catches misroutes</text>

  <!-- E1 Router diamond -->
  <polygon points="1000,275 1135,330 1000,385 865,330" fill="url(#node)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1000" y="324" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">How to</text>
  <text x="1000" y="341" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">retrieve?</text>

  <line x1="865" y1="330" x2="765" y2="428" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="790" y="393" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">scoped</text>

  <line x1="1000" y1="385" x2="1000" y2="428" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1025" y="410" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">broad</text>

  <line x1="1135" y1="330" x2="1255" y2="428" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1210" y="393" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">follow-up</text>

  <!-- F1 Scoped -->
  <rect x="630" y="430" width="230" height="90" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.5"/>
  <text x="745" y="465" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Scoped Retrieval</text>
  <text x="745" y="487" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">named episode(s) only</text>
  <text x="745" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">handles ambiguous titles</text>

  <!-- F2 Broad -->
  <rect x="885" y="430" width="230" height="90" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.5"/>
  <text x="1000" y="465" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Broad Retrieval</text>
  <text x="1000" y="487" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">catalogue-wide search</text>
  <text x="1000" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">capped per episode</text>

  <!-- F3 Follow-up -->
  <rect x="1140" y="430" width="230" height="90" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.5"/>
  <text x="1255" y="465" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Follow-up Retrieval</text>
  <text x="1255" y="487" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">reuses prior chunks</text>
  <text x="1255" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">+ neighbor expansion</text>

  <line x1="240" y1="485" x2="628" y2="475" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="410" y="472" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">from Chroma</text>

  <path d="M240,460 C480,380 760,380 883,475" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <path d="M1230,100 C1385,180 1385,350 1332,428" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="1300" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">prior chunks</text>

  <!-- Convergence into refusal gate -->
  <line x1="745" y1="520" x2="985" y2="558" stroke="#334155" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="1000" y1="520" x2="1000" y2="558" stroke="#334155" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="1255" y1="520" x2="1015" y2="558" stroke="#334155" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- G1 Refusal gate diamond -->
  <polygon points="1000,560 1145,615 1000,670 855,615" fill="url(#node)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1000" y="611" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Covered?</text>
  <text x="1000" y="629" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">(refusal gate)</text>

  <line x1="855" y1="615" x2="765" y2="708" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="790" y="668" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">not covered</text>

  <line x1="1015" y1="668" x2="1045" y2="708" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1055" y="693" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">covered</text>

  <!-- H1 Honest Refusal -->
  <rect x="630" y="710" width="250" height="80" rx="10" fill="url(#node)" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="755" y="742" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Honest Refusal</text>
  <text x="755" y="764" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">states what's not covered</text>
  <text x="755" y="780" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">no invented content</text>

  <!-- H2 Generate Cited Answer -->
  <rect x="910" y="710" width="280" height="80" rx="10" fill="url(#node)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1050" y="742" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Generate Cited Answer</text>
  <text x="1050" y="764" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">Groq gpt-oss-120b</text>
  <text x="1050" y="780" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">must cite every claim</text>

  <line x1="1050" y1="790" x2="1050" y2="818" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- H3 Grounded Answer terminal -->
  <rect x="910" y="820" width="280" height="80" rx="10" fill="url(#node)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1050" y="852" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Grounded Answer</text>
  <text x="1050" y="874" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">(Episode N, mm:ss–mm:ss)</text>
  <text x="1050" y="890" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">cited from retrieval, never parsed</text>
</svg>
